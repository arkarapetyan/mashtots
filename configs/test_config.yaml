# Prediction configuration.
#
# One model:
#   uv run python predict.py 'model.model_paths=[models/mashtots-resnet.pt2]'
# Ensemble (class probabilities are averaged, optionally weighted):
#   uv run python predict.py \
#     'model.model_paths=[models/mashtots-resnet.pt2,models/mashtots-vit.pt2]'

defaults:
  - _self_

seed: 42

data:
  data_dir: ${hydra:runtime.cwd}/data
  batch_size: 128
  num_workers: 8
  pin_memory: True

model:
  model_paths:
    - ${hydra:runtime.cwd}/models/mashtots-resnet.pt2
  weights: null      # e.g. [1.0, 1.0, 0.5]; null = equal weights
  tta: false         # also average over +-tta_shift_px pixel shifts
  tta_shift_px: 2

output:
  output_dir: ${hydra:runtime.cwd}/results
  filename: predictions.csv
