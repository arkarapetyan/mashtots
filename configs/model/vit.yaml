# @package _global_
# Vision Transformer with a convolutional patch stem, trained from scratch.
# Recipe follows small-data ViT practice (DeiT / Compact Convolutional
# Transformers): AdamW, peak LR 5e-4 at batch size 128, weight decay 0.05,
# 10 warmup epochs then cosine decay, stochastic depth 0.1, label smoothing,
# gradient clipping, weight averaging, and a longer schedule than the CNNs.
model:
  model_name: vit
  dropout_rate: 0.1             # classifier-head dropout
  optimizer_lr: 5e-4            # AdamW peak LR, reached after warmup
  optimizer_weight_decay: 0.05  # AdamW decoupled weight decay
  model_kwargs:
    img_size: 64
    patch_size: 4               # 64x64 input -> 16x16 = 256 tokens
    patch_stem: conv            # "conv" (recommended here) or "linear" (original ViT)
    embed_dim: 192
    depth: 8
    num_heads: 6                # 32-dimensional heads
    mlp_ratio: 4.0
    pooling: mean               # "mean" (average over tokens) or "cls"
    drop_path_rate: 0.1
    attn_dropout_rate: 0.0
    mlp_dropout_rate: 0.0
    warmup_epochs: 10
    min_lr: 1e-6
    grad_clip_norm: 1.0

trainer:
  max_epochs: 200               # ViTs keep improving long after CNNs plateau

callback:
  weight_averaging:
    enabled: true
    decay: 0.9998               # averages over ~5,000 steps (~10 epochs at batch 128)
