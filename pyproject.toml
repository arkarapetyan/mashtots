[project]
name = "mashtots"
version = "2.0.0"
description = "Armenian handwritten letter recognition on the Mashtots dataset"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "hydra-core>=1.3.3",
    "omegaconf>=2.3",
    "mlflow>=3.0",
    "onnxruntime>=1.27.0",
    "opencv-python==4.11.0.86",
    "pydantic>=2.0",
    "seaborn>=0.13.2",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "torch==2.10.0",
    "lightning>=2.6.5",
    "torchmetrics>=1.0",
    "torchvision>=0.20.1",
    "tqdm>=4.66",
    "kaggle>=2.2.3",
    "python-dotenv>=1.0",
    "onnxscript>=0.7.1",
]

# torch and torchvision come from PyPI. On Linux x86_64 the PyPI wheels of
# torch 2.10 are the CUDA 12.8 builds (the same as the cu128 index), and they
# run on any NVIDIA driver that supports CUDA 12.x (driver >= 525).
